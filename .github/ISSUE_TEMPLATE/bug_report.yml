name: Relatar um problema
description: Informe um comportamento inesperado sem compartilhar dados reais.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar. Anonimize totalmente o relato e não envie capturas, IDs, nomes, telefones, e-mails, mensagens, cookies ou tokens.

  - type: input
    id: version
    attributes:
      label: Versão do script
      placeholder: Exemplo: 1.3.0
    validations:
      required: true

  - type: dropdown
    id: tags_interface
    attributes:
      label: Interface de Tags
      options:
        - Janela atual de seleção
        - Menu anterior
        - Não sei identificar
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: O que aconteceu?
      description: Descreva apenas o comportamento da interface, usando dados fictícios.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Não inclua links de conversas, IDs ou informações de contatos.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmações
      options:
        - label: Testei em um contato autorizado e removi todos os dados identificáveis deste relato.
          required: true
        - label: Para uma vulnerabilidade, usarei o canal privado indicado na política de segurança.
          required: true
