name: Report a problem
description: Report unexpected behavior without sharing real data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Fully anonymize the report and do not submit screenshots, IDs, names, phone numbers, email addresses, messages, cookies, or tokens.

  - type: input
    id: version
    attributes:
      label: Script version
      placeholder: "Example: 1.3.0"
    validations:
      required: true

  - type: dropdown
    id: tags_interface
    attributes:
      label: Tag interface
      options:
        - Current selection modal
        - Legacy dropdown menu
        - Not sure
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe only the interface behavior and use fictional data.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Do not include conversation links, IDs, or contact information.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmations
      options:
        - label: I tested on an authorized contact and removed all identifiable data from this report.
          required: true
        - label: I will use the private channel in the security policy for any vulnerability.
          required: true
